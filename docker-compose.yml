services:
  kindle-ai-gateway:
    build: .
    container_name: kindle-ai-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      ENABLE_WEB_SEARCH: "true"
      ENABLE_SCHEDULER: "true"
      SEARCH_MAX_RESULTS: "5"
    volumes:
      - kindle_ai_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kindle_ai_data:
