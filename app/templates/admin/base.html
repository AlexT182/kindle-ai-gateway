<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Kindle AI Agent Dashboard" }}</title>
    <!-- Standalone Sleek Dark CSS - Zero External CDN Dependencies -->
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --bg-input: #030712;
            --bg-hover: #1f2937;
            --border-color: #1f293d;
            --border-focus: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --brand-primary: #6366f1;
            --brand-hover: #4f46e5;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        /* Sidebar */
        aside {
            width: 100%;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-shrink: 0;
        }
        @media (min-width: 768px) {
            aside { width: 260px; height: 100vh; position: sticky; top: 0; }
        }

        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .brand-title { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
        .brand-sub { font-size: 11px; color: var(--brand-primary); font-family: monospace; }

        nav { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .nav-link:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .nav-link.active {
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        .nav-link svg { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 2; }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-green);
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 24px 32px;
            overflow-y: auto;
            max-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        /* Typography & Layout */
        h2 { font-size: 22px; font-weight: 700; color: #ffffff; }
        p.subtitle { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; }

        /* Cards & Grid */
        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: rgba(99, 102, 241, 0.4); }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-val { font-size: 24px; font-weight: 700; color: #ffffff; margin-top: 2px; }
        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* Buttons & Forms */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background-color: var(--brand-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover { background-color: var(--brand-hover); }
        .btn-secondary {
            background-color: var(--bg-hover);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover { background-color: #374151; }
        .btn-danger { color: var(--accent-rose); background: transparent; }
        .btn-danger:hover { color: #fda4af; }

        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--border-focus); }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background-color: var(--bg-hover);
            color: var(--text-muted);
        }
        .badge-green { background-color: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-indigo { background-color: rgba(99, 102, 241, 0.15); color: #818cf8; }

        /* Alert / Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .alert-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
        .alert-error { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        .modal-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 540px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div>
            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brand-logo">A</div>
                <div>
                    <div class="brand-title">Alex Agent OS</div>
                    <div class="brand-sub">Kindle Gateway v2.0</div>
                </div>
            </div>

            <!-- Nav Links -->
            <nav>
                <a href="/admin" class="nav-link {{ 'active' if active_tab == 'dashboard' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    <span>Tổng quan (Overview)</span>
                </a>
                <a href="/admin/notes" class="nav-link {{ 'active' if active_tab == 'notes' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span>Sổ tay Tri thức (Vault)</span>
                </a>
                <a href="/admin/graph" class="nav-link {{ 'active' if active_tab == 'graph' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><line x1="7" y1="6" x2="10" y2="10"/><line x1="17" y1="6" x2="14" y2="10"/><line x1="7" y1="18" x2="10" y2="14"/><line x1="17" y1="18" x2="14" y2="14"/></svg>
                    <span>Đồ thị Tri thức (Graph)</span>
                </a>
                <a href="/admin/persona" class="nav-link {{ 'active' if active_tab == 'persona' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span>Cá tính & Trí nhớ (Persona)</span>
                </a>
                <a href="/admin/scheduler" class="nav-link {{ 'active' if active_tab == 'scheduler' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>Lập lịch (Cron Jobs)</span>
                </a>
                <a href="/admin/mcp" class="nav-link {{ 'active' if active_tab == 'mcp' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="8" height="8" x="2" y="2" rx="1"/><rect width="8" height="8" x="14" y="2" rx="1"/><rect width="8" height="8" x="2" y="14" rx="1"/><rect width="8" height="8" x="14" y="14" rx="1"/></svg>
                    <span>Hệ sinh thái MCP Tools</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="status-dot"></span>
                <span>Kindle Connected</span>
            </div>
            <a href="/admin/logout" style="color: var(--accent-rose); text-decoration: none; font-weight: 600;">Thoát</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
