<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Kindle AI Agent Dashboard</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --bg-input: #030712;
            --border-color: #1f293d;
            --border-focus: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --brand-primary: #6366f1;
            --brand-hover: #4f46e5;
            --accent-rose: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        h1 { font-size: 20px; font-weight: 700; text-align: center; color: #ffffff; }
        p { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 4px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: var(--border-focus); }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: background-color 0.15s;
        }
        button:hover { background-color: var(--brand-hover); }
        .alert {
            padding: 10px 14px;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 8px;
            color: #fb7185;
            font-size: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">A</div>
        <h1>Kindle AI Agent OS</h1>
        <p>Nhập Auth Secret Key để truy cập Dashboard</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>Auth Secret Token</label>
                <input type="password" name="token" required placeholder="Nhập kindle-secret-token..." autofocus>
            </div>
            <button type="submit">Đăng Nhập Dashboard</button>
        </form>
    </div>
</body>
</html>
