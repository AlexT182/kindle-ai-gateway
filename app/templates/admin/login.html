<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Kindle AI Agent</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f4f6; color: #111; }
        .login-card { width: min(390px, calc(100% - 40px)); box-sizing: border-box; padding: 34px; background: #fff; border: 2px solid #111; border-radius: 12px; box-shadow: 8px 8px 0 #111; }
        .logo-box { width: 48px; height: 48px; display: grid; place-items: center; margin: 0 auto; background: #111; color: #fff; font-size: 24px; font-weight: 700; border-radius: 8px; }
        h1 { margin: 18px 0 8px; font-size: 24px; text-align: center; }
        p { margin: 0 0 24px; color: #4b5563; text-align: center; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; padding: 13px; border: 2px solid #111; border-radius: 7px; font-size: 16px; }
        button { width: 100%; margin-top: 16px; padding: 13px; border: 2px solid #111; border-radius: 7px; background: #111; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .alert { margin-bottom: 16px; padding: 11px; border: 2px solid #991b1b; background: #fee2e2; color: #7f1d1d; border-radius: 7px; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="logo-box">A</div>
        <h1>Kindle AI Agent OS</h1>
        <p>Nhập mật khẩu quản trị để truy cập Dashboard.</p>
        {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <label for="password">Mật khẩu quản trị</label>
            <input id="password" type="password" name="password" required autocomplete="current-password" autofocus>
            <button type="submit">Đăng nhập Dashboard</button>
        </form>
    </main>
</body>
</html>
