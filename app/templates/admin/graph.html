{% extends "admin/base.html" %}

{% block content %}
<div class="container">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <div>
            <h2>Interactive Knowledge Graph View</h2>
            <p class="subtitle">Trực quan hóa mạng lưới liên kết giữa các cuốn sách, ghi chú và khái niệm chuẩn Obsidian.</p>
        </div>
        <div style="display: flex; gap: 14px; font-size: 12px;">
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #10b981; display: inline-block;"></span>Sách</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #6366f1; display: inline-block;"></span>Ghi chú</span>
            <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span>Khái niệm</span>
        </div>
    </div>

    <!-- Graph Canvas Container -->
    <div class="card" style="padding: 0; overflow: hidden; height: 600px; position: relative;">
        <canvas id="graphCanvas" style="width: 100%; height: 100%; display: block;"></canvas>
        <div id="graphLoading" style="position: absolute; inset: 0; background: var(--bg-card); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px;">
            Đang tải dữ liệu đồ thị...
        </div>
    </div>
</div>

<!-- Standalone High-Performance 2D/3D Force Graph Engine (Zero External CDN Failure Risk) -->
<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    fetch('/v1/vault/graph')
        .then(res => res.json())
        .then(data => {
            document.getElementById('graphLoading').style.display = 'none';
            const nodes = data.nodes || [];
            const links = data.links || [];

            // Initialize random positions around center
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            nodes.forEach((n, i) => {
                const angle = (i / nodes.length) * Math.PI * 2;
                const r = 100 + Math.random() * 80;
                n.x = cx + Math.cos(angle) * r;
                n.y = cy + Math.sin(angle) * r;
                n.vx = 0;
                n.vy = 0;
            });

            const nodeMap = {};
            nodes.forEach(n => nodeMap[n.id] = n);

            // Simulation loop
            function step() {
                // Apply spring forces on links
                links.forEach(l => {
                    const s = typeof l.source === 'object' ? l.source : nodeMap[l.source];
                    const t = typeof l.target === 'object' ? l.target : nodeMap[l.target];
                    if (s && t) {
                        const dx = t.x - s.x;
                        const dy = t.y - s.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        const force = (dist - 140) * 0.005;
                        s.vx += (dx / dist) * force;
                        s.vy += (dy / dist) * force;
                        t.vx -= (dx / dist) * force;
                        t.vy -= (dy / dist) * force;
                    }
                });

                // Repulsion between nodes
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const a = nodes[i];
                        const b = nodes[j];
                        const dx = b.x - a.x;
                        const dy = b.y - a.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        if (dist < 250) {
                            const rep = (250 - dist) * 0.02;
                            a.vx -= (dx / dist) * rep;
                            a.vy -= (dy / dist) * rep;
                            b.vx += (dx / dist) * rep;
                            b.vy += (dy / dist) * rep;
                        }
                    }
                }

                // Update positions & friction
                nodes.forEach(n => {
                    n.x += n.vx;
                    n.y += n.vy;
                    n.vx *= 0.85;
                    n.vy *= 0.85;
                    // Boundary
                    n.x = Math.max(40, Math.min(canvas.width - 40, n.x));
                    n.y = Math.max(40, Math.min(canvas.height - 40, n.y));
                });

                // Render
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Links
                ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
                ctx.lineWidth = 1.5;
                links.forEach(l => {
                    const s = typeof l.source === 'object' ? l.source : nodeMap[l.source];
                    const t = typeof l.target === 'object' ? l.target : nodeMap[l.target];
                    if (s && t) {
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(t.x, t.y);
                        ctx.stroke();
                    }
                });

                // Draw Nodes
                nodes.forEach(n => {
                    ctx.beginPath();
                    const radius = n.group === 'Book' ? 10 : 7;
                    ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
                    if (n.group === 'Book') ctx.fillStyle = '#10b981';
                    else if (n.group === 'Concept') ctx.fillStyle = '#f59e0b';
                    else ctx.fillStyle = '#6366f1';
                    ctx.fill();

                    // Label
                    ctx.fillStyle = '#f8fafc';
                    ctx.font = '11px sans-serif';
                    ctx.fillText(n.name, n.x + 12, n.y + 4);
                });

                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        })
        .catch(err => {
            document.getElementById('graphLoading').innerText = 'Không thể tải đồ thị: ' + err;
        });
</script>
{% endblock %}
