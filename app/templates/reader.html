<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>{{ item.name }} — Kindle Web Reader</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #reader-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }
        #page-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            margin: auto;
            background-color: #ffffff;
        }
        .fit-width #page-image {
            width: 100%;
            max-width: 100%;
            max-height: none;
            height: auto;
        }
        .fit-width {
            overflow-y: auto !important;
            align-items: flex-start !important;
        }
        /* Tap Zones */
        .tap-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 10;
        }
        #zone-prev {
            left: 0;
            width: 32%;
            cursor: pointer;
        }
        #zone-menu {
            left: 32%;
            width: 36%;
            cursor: pointer;
        }
        #zone-next {
            right: 0;
            width: 32%;
            cursor: pointer;
        }
        /* Top & Bottom Menus */
        .bar {
            position: absolute;
            left: 0;
            right: 0;
            background: #000000;
            color: #ffffff;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 30;
            font-size: 14px;
            border: 2px solid #ffffff;
            transition: transform 0.15s ease-in-out;
        }
        #top-bar {
            top: 0;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        #bottom-bar {
            bottom: 0;
            border-bottom: none;
            border-left: none;
            border-right: none;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bar.hidden {
            display: none !important;
        }
        .book-title {
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60%;
        }
        .btn-ui {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
        }
        .btn-ui:active {
            background: #cccccc;
        }
        .page-counter {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }
        .jump-box {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .jump-input {
            width: 50px;
            padding: 4px;
            font-size: 14px;
            text-align: center;
            border: 2px solid #ffffff;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000;
            color: #ffffff;
            padding: 10px 18px;
            border: 2px solid #ffffff;
            font-size: 14px;
            font-weight: bold;
            z-index: 25;
            display: none;
        }
    </style>
</head>
<body>
    <div id="reader-container">
        <!-- Top Toolbar -->
        <div id="top-bar" class="bar">
            <a href="/library" class="btn-ui">⬅ Thư Viện</a>
            <div class="book-title" title="{{ item.name }}">{{ item.name }}</div>
            <button id="btn-fit" class="btn-ui" onclick="toggleFitMode()">Khổ: Vừa Trang</button>
        </div>

        <!-- Main Image -->
        <img id="page-image" src="" alt="Đang tải trang...">
        <div id="loading-indicator">Đang tải trang...</div>

        <!-- Tap Zones -->
        <div id="zone-prev" class="tap-zone" onclick="prevPage()"></div>
        <div id="zone-menu" class="tap-zone" onclick="toggleBars()"></div>
        <div id="zone-next" class="tap-zone" onclick="nextPage()"></div>

        <!-- Bottom Toolbar -->
        <div id="bottom-bar" class="bar">
            <button class="btn-ui" onclick="prevPage()">◀ Lùi</button>
            <div class="jump-box">
                <input id="input-page" type="number" class="jump-input" min="1" value="1" onchange="jumpPage(this.value)">
                <span class="page-counter">/ <span id="total-pages">...</span></span>
            </div>
            <button class="btn-ui" onclick="jumpPage(document.getElementById('input-page').value)">Tới</button>
            <button class="btn-ui" onclick="nextPage()">Tiến ▶</button>
        </div>
    </div>

    <script>
        var fileId = "{{ file_id }}";
        var currentPage = parseInt("{{ initial_page }}") || 1;
        var totalPages = 1;
        var menuVisible = true;
        var fitMode = "page"; // "page" or "width"
        var storageKey = "kindle_reader_pos_" + fileId;

        // Restore saved page if available and no query param overridden
        try {
            var saved = localStorage.getItem(storageKey);
            if (saved && (!window.location.search || window.location.search.indexOf("page=") === -1)) {
                var p = parseInt(saved, 10);
                if (p >= 1) currentPage = p;
            }
        } catch (e) {}

        function getPageUrl(p) {
            return "/api/v1/library/page/" + encodeURIComponent(fileId) + "/" + p + "?max_w=1072&max_h=1448&quality=80";
        }

        function showLoading(show) {
            var loader = document.getElementById("loading-indicator");
            if (loader) {
                loader.style.display = show ? "block" : "none";
            }
        }

        function renderCurrentPage() {
            showLoading(true);
            var img = document.getElementById("page-image");
            var targetSrc = getPageUrl(currentPage);

            var preloader = new Image();
            preloader.onload = function() {
                img.src = targetSrc;
                showLoading(false);
                // Preload next page
                if (currentPage < totalPages) {
                    var nextImg = new Image();
                    nextImg.src = getPageUrl(currentPage + 1);
                }
            };
            preloader.onerror = function() {
                showLoading(false);
                alert("Không thể tải trang " + currentPage + ". Nhấn thử lại!");
            };
            preloader.src = targetSrc;

            document.getElementById("input-page").value = currentPage;

            try {
                localStorage.setItem(storageKey, currentPage.toString());
            } catch (e) {}
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderCurrentPage();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderCurrentPage();
            }
        }

        function jumpPage(val) {
            var p = parseInt(val, 10);
            if (isNaN(p) || p < 1) p = 1;
            if (totalPages > 1 && p > totalPages) p = totalPages;
            currentPage = p;
            renderCurrentPage();
        }

        function toggleBars() {
            menuVisible = !menuVisible;
            var topBar = document.getElementById("top-bar");
            var bottomBar = document.getElementById("bottom-bar");
            if (menuVisible) {
                topBar.classList.remove("hidden");
                bottomBar.classList.remove("hidden");
            } else {
                topBar.classList.add("hidden");
                bottomBar.classList.add("hidden");
            }
        }

        function toggleFitMode() {
            var container = document.getElementById("reader-container");
            var btn = document.getElementById("btn-fit");
            if (fitMode === "page") {
                fitMode = "width";
                container.classList.add("fit-width");
                btn.innerText = "Khổ: Tràn Ngang";
            } else {
                fitMode = "page";
                container.classList.remove("fit-width");
                btn.innerText = "Khổ: Vừa Trang";
            }
        }

        // Keyboard navigation for Kindle keys / external keyboards
        window.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft" || e.key === "PageUp") {
                prevPage();
            } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
                nextPage();
            }
        });

        // Fetch book info
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/v1/library/info/" + encodeURIComponent(fileId), true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    totalPages = data.total_pages || 1;
                    document.getElementById("total-pages").innerText = totalPages;
                    document.getElementById("input-page").max = totalPages;
                    if (currentPage > totalPages) currentPage = totalPages;
                    renderCurrentPage();
                } catch (e) {
                    renderCurrentPage();
                }
            } else {
                renderCurrentPage();
            }
        };
        xhr.onerror = function() {
            renderCurrentPage();
        };
        xhr.send();
    </script>
</body>
</html>
